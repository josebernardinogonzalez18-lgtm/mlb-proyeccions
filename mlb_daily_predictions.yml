name: MLB Daily Predictions - Refactored Pipeline

on:
  schedule:
    # Ejecutar a las 12:00 UTC todos los días
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Fecha para predicción (YYYY-MM-DD). Dejar vacío para hoy.'
        required: false
        type: string

jobs:
  test-and-predict:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4
      
      - name: 🐍 Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install xgboost scikit-learn pandas numpy requests joblib
      
      - name: 🧪 Ejecutar suite de tests
        run: |
          echo "🧪 Validando Fase 1, 2 y 3..."
          python test_refactored.py
          if [ $? -ne 0 ]; then
            echo "❌ Tests fallaron"
            exit 1
          fi
          echo "✅ Todos los tests pasaron"
      
      - name: 🤖 Ejecutar pipeline de predicción
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          TARGET_DATE="${{ github.event.inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE=$(date -u '+%Y-%m-%d')
          fi
          echo "🔮 Generando predicciones para: $TARGET_DATE"
          python mlb_betting_refactored.py "$TARGET_DATE"
      
      - name: 📊 Cargar resultados
        if: always()
        run: |
          if [ -d "output" ]; then
            echo "📁 Archivos generados:"
            ls -lh output/
          else
            echo "⚠️ No se encontró directorio output"
          fi
      
      - name: 📤 Subir artefactos
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: predictions-${{ matrix.python-version }}
          path: output/
          retention-days: 7
      
      - name: 📄 Subir logs del workflow
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: workflow-logs-${{ matrix.python-version }}
          path: |
            data/
            models/
          retention-days: 3

  notify-completion:
    needs: test-and-predict
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: ✅ Workflow completado
        run: |
          echo "🎉 Pipeline MLBProjections completado exitosamente"
          echo "Resultados disponibles en artifacts"
